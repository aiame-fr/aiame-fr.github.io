    _decouper(texte, final) {

<script>
(function(){
  'use strict';
  const D = JSON.parse(document.getElementById('donnees').textContent);
  const CENTRE = 'aiame';
  const STATUTS = [['prouvé', '#7FC08F'], ['déclaré', '#E2B45A']];
  const L = {
    fr: {tenue:'tenue', declaree:'déclarée', fermer:'Fermer', pieces:'Ce qui la tient', plus:'de plus', aucune:'Tenue — la pièce n’est pas publiée (hors des dépôts publics de ce relevé).',
         declNote:'Déclarée : écrite ou décidée, rien ne la vérifie encore.', famille:'Famille', liste:'Voir la famille dans la liste', date:'écrite le',
         legBras:'une étoile par valeur · un bras par famille · grande = plus de pièces', legPreuve:'couleur = statut dérivé de la valeur · aucune main ne l’écrit',
         vide:'Choisissez une étoile : la valeur, son statut et ce qui la tient.'},
    en: {tenue:'held', declaree:'declared', fermer:'Close', pieces:'What holds it', plus:'more', aucune:'Held — the evidence is not published (outside the public repositories of this survey).',
         declNote:'Declared: written or decided, and nothing checks it yet.', famille:'Family', liste:'See the family in the list', date:'written on',
         legBras:'one star per value · one arm per family · larger = more pieces', legPreuve:'colour = status derived from the value · no hand writes it',
         vide:'Pick a star: the value, its status and what holds it.'},
  };
  const LIBELLES = {
    fr: {recherche:'Filtrer : un mot, statut:prouvé…', etiquettes:'Étiquettes', reinit:'Tout réinitialiser', aucun:'aucun résultat', retirer:'Retirer', sur:'sur', racine:'Valeurs', entrer:'entrer', etoiles:'valeurs', plus:'de plus'},
    en: {recherche:'Filter: a word, statut:prouvé…', etiquettes:'Tags', reinit:'Reset all', aucun:'no result', retirer:'Remove', sur:'of', racine:'Values', entrer:'enter', etoiles:'values', plus:'more'},
  };
  const etat = {lang: 'fr', lentille: 'bras', sel: null};
  try { const l = localStorage.getItem('galaxie-lang'); if (l === 'en' || l === 'fr') etat.lang = l; else if ((navigator.language || '').toLowerCase().startsWith('en')) etat.lang = 'en'; } catch (e) {}
  const T = (k) => L[etat.lang][k];
  const txt = (d, k) => d[k + '_' + etat.lang] || d[k + '_fr'] || '';
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const ms = (d) => Date.parse(d) || 0;
  const V = {}; D.valeurs.forEach(v => { V[v.id] = v; });
  const couleurFamille = (fid) => `var(--f${D.ordre.indexOf(fid) % 9})`;
  const atlas = document.getElementById('atlas'), pan = document.getElementById('panneau');

  const donneesAtlas = () => ({
    centre: CENTRE, cleGroupe: 'famille',
    groupes: D.ordre.map(f => ({id: f, label: txt(D.familles[f], 'label'), couleur: couleurFamille(f)})),
    noeuds: [{id: CENTRE, label: 'doctrine', titre: txt(D.familles[D.ordre[0]], 'texte'), groupe: D.ordre[0], taille: 13, etiquettes: {kind: 'centre'}}]
      .concat(D.valeurs.map(v => ({id: v.id, label: v.label, titre: txt(v, 'titre'), groupe: v.famille, ordre: ms(v.date),
        taille: Math.min(12, 5 + Math.sqrt(v.preuves_n)), etiquettes: {famille: v.famille, statut: v.statut},
        texte: [v.id, v.label, txt(v, 'titre')].join(' ')}))),
    liens: [],
  });

  function legende() {
    const svg = atlas.shadowRoot.querySelector('svg'), etroit = !!(svg && svg.classList.contains('etroit'));
    const familles = etroit ? D.ordre.map(f => `<span><span class="pt" style="background:${couleurFamille(f)}"></span>${esc(txt(D.familles[f], 'label'))}</span>`).join('') : '';
    document.getElementById('legende').innerHTML = etat.lentille === 'preuve'
      ? STATUTS.map(([s, c]) => `<span><span class="pt" style="background:${c}"></span>${esc(s === 'prouvé' ? T('tenue') : T('declaree'))}</span>`).join('') + `<span>${T('legPreuve')}</span>`
      : (familles || `<span>${T('legBras')}</span>`);
  }
  function lentille(nom) {
    etat.lentille = nom;
    document.querySelectorAll('.lentilles button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lentille === nom)));
    atlas.teindre(nom === 'preuve' ? (n => { const s = (n.etiquettes || {}).statut; return s ? (STATUTS.find(x => x[0] === s) || [])[1] || null : null; }) : null);
    atlas.liens('selection'); legende(); atlas.etatHote(nom !== 'bras');
  }
  const chip = (s) => `<span class="chip ${esc(s)}">${esc(s === 'prouvé' ? T('tenue') : T('declaree'))}</span>`;
  function panneauValeur(vid) {
    const v = V[vid], f = D.familles[v.famille];
    let corps;
    if (v.statut === 'prouvé') {
      corps = v.preuves.length
        ? `<p class="p-titre">${T('pieces')}</p><ul class="p-liste">${v.preuves.map(p => `<li><code>${esc(p)}</code></li>`).join('')}${v.preuves_n > v.preuves.length ? `<li class="muted">+ ${v.preuves_n - v.preuves.length} ${T('plus')}</li>` : ''}</ul>`
        : `<p class="muted">${T('aucune')}</p>`;
    } else corps = `<p class="muted">${T('declNote')}</p>`;
    pan.innerHTML = `<button type="button" class="fermer" aria-label="${T('fermer')}">×</button>
      <p class="eyebrow">${esc(txt(f, 'label'))}</p><h2 class="p-nom">${esc(v.label)}</h2><p>${chip(v.statut)}</p>
      <p style="margin-top:.6rem">${esc(txt(v, 'titre'))}</p>${corps}
      <p class="muted" style="margin-top:.8rem">${T('date')} ${esc(v.date)} · <a href="${etat.lang === 'en' ? 'https://aiame.fr/en/valeurs/' : 'https://aiame.fr/valeurs/'}#${esc(v.famille)}">${T('liste')}</a></p>`;
    pan.hidden = false;
    pan.querySelector('.fermer').addEventListener('click', lacher);
  }
  function lacher() { etat.sel = null; atlas.selectionner(null); pan.hidden = true; pan.replaceChildren(); try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} }
  function surSelection(id) {
    if (!id || id === CENTRE || !V[id]) { lacher(); return; }
    etat.sel = id; panneauValeur(id);
    try { history.replaceState(null, '', '#' + id); } catch (e) {}
  }
  atlas.addEventListener('atlas-select', (ev) => surSelection(ev.detail.id));
  atlas.addEventListener('atlas-reinit', () => { lentille('bras'); if (etat.sel) lacher(); });
  document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape' && etat.sel && !ev.defaultPrevented) lacher(); });
  document.querySelectorAll('.lentilles button').forEach(b => b.addEventListener('click', () => lentille(b.dataset.lentille)));

  function langue(l) {
    etat.lang = l; document.documentElement.lang = l;
    try { localStorage.setItem('galaxie-lang', l); } catch (e) {}
    document.querySelectorAll('.t[data-en]').forEach(sp => { if (!sp.dataset.fr) sp.dataset.fr = sp.textContent; sp.textContent = l === 'en' ? sp.dataset.en : sp.dataset.fr; });
    document.querySelectorAll('footer a[data-en-href]').forEach(a => { a.href = l === 'en' ? a.dataset.enHref : a.dataset.fr; });
    document.querySelectorAll('.lang button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === l)));
    atlas.libelles = LIBELLES[l]; atlas.data = donneesAtlas(); lentille(etat.lentille); requestAnimationFrame(() => { ajuster(); legende(); });
    const cur = etat.sel; etat.sel = null; pan.hidden = true; if (cur) { atlas.selectionner(cur); surSelection(cur); }
  }
  document.querySelectorAll('.lang button').forEach(b => b.addEventListener('click', () => langue(b.dataset.lang)));

  // Le composant dessine un ciel carré dont la hauteur suit la largeur : on réduit sa largeur jusqu'à ce que tout (barre de filtre comprise)
  // tienne dans l'écran. Le composant lui-même n'est pas touché (même octets que sur les autres pages).
  const ciel = document.getElementById('ciel');
  // un nom d'étoile plus long que la marge du cadre déborde au lieu d'être coupé : #ciel (overflow:hidden) tient l'écran, la racine du composant est ouverte
  const regle = document.createElement('style'); regle.textContent = 'svg{overflow:visible} svg.etroit .etiq{display:none}'; atlas.shadowRoot.appendChild(regle);
  function ajuster() {
    const cw = ciel.clientWidth, ch = ciel.clientHeight;
    if (!cw || !ch) return;
    const svg = atlas.shadowRoot.querySelector('svg'), vbw = (svg && svg.viewBox.baseVal.width) || 1000;
    // grand écran : les noms débordent dans les marges, on les leur laisse ; sinon le composant passe en ciel étroit (k < 0,62) et garde
    // chaque nom dans sa boîte — en ne montrant que les grandes étoiles, le reste au survol et à la sélection.
    const marge = cw - 2 * 240;
    let w = marge >= 0.62 * vbw ? Math.min(cw, marge) : Math.min(cw, Math.floor(0.6 * vbw));
    atlas.style.width = w + 'px';
    for (let i = 0; i < 4 && atlas.offsetHeight > ch + 1; i++) { w = Math.max(220, Math.floor(w * ch / atlas.offsetHeight)); atlas.style.width = w + 'px'; }
  }
  if (window.ResizeObserver) new ResizeObserver(() => { ajuster(); legende(); }).observe(ciel); else window.addEventListener('resize', () => { ajuster(); legende(); });
  atlas.addEventListener('atlas-niveau', () => requestAnimationFrame(() => { ajuster(); legende(); }));
  atlas.libelles = LIBELLES[etat.lang]; atlas.data = donneesAtlas(); lentille('bras'); requestAnimationFrame(() => { ajuster(); legende(); });
  if (etat.lang === 'en') langue('en');
  const h = decodeURIComponent((location.hash || '').slice(1));
  if (h && V[h]) { atlas.selectionner(h); surSelection(h); }
})();
</script>
